# ============================================================
# FILE: pubspec.yaml
# ============================================================
name: peso_scan
description: Philippine banknote authentication app using YOLO detection

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  onnxruntime: ^1.4.1
  path_provider: ^2.1.4
  image: ^4.0.17
  camera: ^0.11.3
  flutter_tts: ^3.8.5
  permission_handler: ^11.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/models/detector.onnx
    - assets/models/verifier_old.onnx
    - assets/models/verifier_polymer.onnx
    - assets/labels/labels_detector.txt
    - assets/labels/labels_old.txt
    - assets/labels/labels_polymer.txt